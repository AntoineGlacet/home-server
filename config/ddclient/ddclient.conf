daemon=1000 # check every 1000 seconds
verbose=yes
syslog=yes # log update msgs to syslog
pid=/var/run/ddclient.pid # record PID in file
ssl=yes # use TLS
use=web # get IP with website below
web='https://cloudflare.com/cdn-cgi/trace'
web-skip='ip=' # IP address above is after 'ip='

# Configuration for antoineglacet.com
protocol=cloudflare, \
zone=antoineglacet.com, \
ttl=1, \
login=token, \
password_env=DDCLIENT_CLOUDFLARE_TOKEN \
antoineglacet.com

# WireGuard VPN endpoint — MUST stay DNS-only (grey cloud) in Cloudflare so
# WireGuard's UDP reaches home directly instead of Cloudflare's proxy.
protocol=cloudflare, \
zone=antoineglacet.com, \
ttl=1, \
login=token, \
password_env=DDCLIENT_CLOUDFLARE_TOKEN \
vpn.antoineglacet.com

# Disabled: kanku.dev is not in the Cloudflare account DDCLIENT_CLOUDFLARE_TOKEN
# belongs to, so every run (every 1000s) ended in
#   FAILED: [cloudflare][handbook.kanku.dev]> no zone ID found for zone kanku.dev
# which is pure noise and masks a genuine update failure on the records that do
# matter. Re-enable once the token covers the zone.
