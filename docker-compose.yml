networks:
  homelab:
    # primary shared network for most services
    name: homelab
    driver: bridge
  homelab_proxy:
    # external reverse-proxy network
    name: homelab_proxy
    driver: bridge

# ----------------------------
# SHARED DEFAULTS
# ----------------------------
# Cap every container's json-file log. Without this Docker keeps container logs
# forever: loki alone reached 21 GiB and took the root filesystem to 95%.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------
  # CORE SMART-HOME STACK
  # ----------------------------

  home-assistant:
    logging: *default-logging
    image: homeassistant/home-assistant:2026.4
    container_name: home-assistant
    user: "1000:1000"
    volumes:
      - ./config/homeassistant:/config
      - ${MEDIA}:/media
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    network_mode: host # needs host networking for discovery/integrations
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.tls.certresolver=cloudflare"
      - "traefik.http.services.homeassistant.loadbalancer.server.url=http://host.docker.internal:8123"

  mqtt:
    logging: *default-logging
    image: eclipse-mosquitto:2.0.21
    container_name: mqtt
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/data:/mosquitto/data
      - ./config/mosquitto/log:/mosquitto/log
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    networks:
      - homelab

  zigbee2mqtt:
    logging: *default-logging
    image: koenkk/zigbee2mqtt:1.42.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=${MQTT_SERVER}
      - ZIGBEE2MQTT_CONFIG_MQTT_USER=${MQTT_USER}
      - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - /run/udev:/run/udev:ro
      - ./config/zigbee2mqtt:/app/data
    devices:
      - ${ZIGBEE_ADAPTOR_PATH}:/dev/ttyUSB0
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee2mqtt.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.zigbee2mqtt.entrypoints=websecure"
      - "traefik.http.routers.zigbee2mqtt.tls.certresolver=cloudflare"
      - "traefik.http.routers.zigbee2mqtt.middlewares=authentik@docker"
      - "traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8099"

  # ----------------------------
  # MONITORING & METRICS
  # ----------------------------

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    user: "1000"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tokyo
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./config/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    networks:
      - homelab
      - homelab_proxy

  node_exporter:
    logging: *default-logging
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    logging: *default-logging
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-housekeeping_interval=30s'
      - '-docker_only=true'
      - '-store_container_labels=true'
      - '-disable_metrics=percpu,process,sched,tcp,udp,diskIO,disk,advtcp'
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - homelab

  blackbox-exporter:
    logging: *default-logging
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    command:
      - '--config.file=/config/blackbox.yml'
    volumes:
      - ./config/blackbox-exporter:/config
    restart: unless-stopped
    networks:
      - homelab

  grafana:
    logging: *default-logging
    image: grafana/grafana:13.1.4
    container_name: grafana
    user: "1000"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Oauth2
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GF_AUTH_GENERIC_OAUTH_ENABLED}
      - GF_AUTH_GENERIC_OAUTH_NAME=${GF_AUTH_GENERIC_OAUTH_NAME}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=${GF_AUTH_GENERIC_OAUTH_SCOPES}
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${GF_AUTH_GENERIC_OAUTH_AUTH_URL}
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${GF_AUTH_GENERIC_OAUTH_TOKEN_URL}
      - GF_AUTH_GENERIC_OAUTH_API_URL=${GF_AUTH_GENERIC_OAUTH_API_URL}
      - GF_AUTH_SIGNOUT_REDIRECT_URL=${GF_AUTH_SIGNOUT_REDIRECT_URL}
      # Optionally enable auto-login (bypasses Grafana login screen)
      - GF_AUTH_OAUTH_AUTO_LOGIN=${GF_AUTH_OAUTH_AUTO_LOGIN}
      # Optionally map user groups to Grafana roles
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH}
      # Required if Grafana is running behind a reverse proxy
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      # Enable unified alerting (default in Grafana 11.4+)
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Discord webhook for contact point (passed from .env)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.routers.grafana.middlewares=authentik@docker"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    logging: *default-logging
    image: grafana/loki:2.9.4
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "1000:1000"
    volumes:
      - ./config/loki:/etc/loki
      - ./data/loki:/loki
    restart: unless-stopped
    networks:
      - homelab

  promtail:
    logging: *default-logging
    image: grafana/promtail:2.9.4
    container_name: promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail:/etc/promtail
      - ./data/promtail:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - homelab

  glances:
    logging: *default-logging
    image: nicolargo/glances:4.5.6-full
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      - GLANCES_OPT=-w --disable-check-update
      - TZ=${TZ}
    volumes:
      - /:/host:ro
      - /mnt/media:/mnt/media:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.glances.rule=Host(`glances.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.glances.entrypoints=websecure"
      - "traefik.http.routers.glances.tls.certresolver=cloudflare"
      - "traefik.http.routers.glances.middlewares=authentik@docker"
      - "traefik.http.services.glances.loadbalancer.server.port=61208"

  # ----------------------------
  # VPN (NORDLYNX) + MEDIA DOWNLOADS VIA VPN
  # ----------------------------

  nordlynx:
    logging: *default-logging
    image: ghcr.io/bubuntux/nordlynx@sha256:2e1444bec3f67820e04e2755a5eb9d51f2d52453aff577e8a0b52f6cbeb364f3  # pinned (no semver tags upstream)
    container_name: nordlynx
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PRIVATE_KEY=${NORDVPN_PRIVATE_KEY}
      - NET_LOCAL=${LOCAL_NETWORK} # e.g., 192.168.0.0/16
    # Publish ports for any services sharing this network namespace (below)
    ports:
      - "51413:51413"
      - "51413:51413/udp"
      - "9091:9091" # Transmission Web UI
      - "9696:9696" # Prowlarr Web UI
    restart: unless-stopped
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.service=transmission"
      - "traefik.http.routers.transmission.tls.certresolver=cloudflare"
      - "traefik.http.routers.transmission.middlewares=authentik@docker"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.routers.prowlarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.prowlarr.middlewares=authentik@docker"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  transmission:
    logging: *default-logging
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls354
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # - TRANSMISSION_WEB_HOME=/flood-for-transmission/ #optional
    volumes:
      - ./config/transmission:/config
      - ${DOWNLOADS}:/downloads
      - ${WATCH}:/watch
    # Route ALL traffic through VPN by sharing network namespace
    network_mode: service:nordlynx
    depends_on:
      - nordlynx
    restart: unless-stopped
    # Ping an IP, not a hostname: busybox ping's resolver fails against NordVPN's
    # DNS ("bad address") even when the app resolves fine, causing a permanent
    # autoheal restart loop. Pinging 1.1.1.1 still validates the VPN tunnel
    # (the killswitch blocks it if the tunnel drops), without the DNS dependency.
    healthcheck:
      test: [ "CMD", "ping", "-c", "1", "1.1.1.1" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prowlarr:
    logging: *default-logging
    image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls154
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:prowlarr
      - TP_THEME=overseerr
    volumes:
      - ./config/prowlarr:/config
    # Route ALL traffic through VPN by sharing network namespace
    network_mode: service:nordlynx
    depends_on:
      - nordlynx
    restart: unless-stopped
    # See transmission above: ping an IP, not a hostname, to avoid busybox's
    # DNS resolver failing against NordVPN's servers and triggering an autoheal
    # restart loop. 1.1.1.1 still fails (as desired) if the VPN tunnel drops.
    healthcheck:
      test: [ "CMD", "ping", "-c", "1", "1.1.1.1" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sonarr:
    logging: *default-logging
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:sonarr
      - TP_THEME=overseerr
    volumes:
      - ./config/sonarr:/config
      - ${TV}:/tv
      - ${DOWNLOADS}:/downloads
    depends_on:
      - prowlarr
      - transmission
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.sonarr.middlewares=authentik@docker"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  radarr:
    logging: *default-logging
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312
    container_name: radarr
    hostname: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:radarr
      - TP_THEME=overseerr
    volumes:
      - ./config/radarr:/config
      - ${MOVIES}:/movies
      - ${DOWNLOADS}:/downloads
    depends_on:
      - prowlarr
      - transmission
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.radarr.middlewares=authentik@docker"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  bazarr:
    logging: *default-logging
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls355
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:bazarr
      - TP_THEME=overseerr
    volumes:
      - ./config/bazarr:/config
      - ${MOVIES}:/movies
      - ${TV}:/tv
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.bazarr.middlewares=authentik@docker"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  # Recyclarr — syncs TRaSH-guide quality definitions & custom formats into
  # Sonarr/Radarr as code. The image runs a built-in cron (default @daily).
  # Config lives in config/recyclarr/recyclarr.yml (tracked in git); API keys
  # come from .env via !env_var so no secrets land in the repo.
  recyclarr:
    logging: *default-logging
    image: ghcr.io/recyclarr/recyclarr:8.3.2
    container_name: recyclarr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - homelab

  # ----------------------------
  # MEDIA SERVING & DISCOVERY
  # ----------------------------

  plex:
    logging: *default-logging
    image: lscr.io/linuxserver/plex:1.43.3.10828-00f62d37d-ls315
    container_name: plex
    network_mode: host # best for DLNA, HW accel, discovery
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - version=docker
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:plex
      - TP_THEME=overseerr
    volumes:
      - ./config/plex:/config
      - ${MEDIA}:/media
    # Intel Quick Sync (HD 630) for hardware transcoding.
    # NOTE: Plex only uses this with an active Plex Pass — the GPU stays idle
    # until then. group_add gives the container access to the render node
    # (GID 109 = `render` on the host; 44 = `video`).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "109"
      - "44"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls.certresolver=cloudflare"
      # ⚠️ Strongly recommend NO Authentik in front of Plex (breaks many clients) 
      # - "traefik.http.routers.plex.middlewares=authentik@docker"
      - "traefik.http.services.plex.loadbalancer.server.url=http://host.docker.internal:32400"

  # this is kind of useless to run continuously, let's stop that.
  # overseerr:
  #   image: lscr.io/linuxserver/overseerr:latest
  #   container_name: overseerr
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #   volumes:
  #     - ./config/overseerr:/config # fixed path name
  #   restart: unless-stopped
  #   networks:
  #     - homelab
  #     - homelab_proxy
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.docker.network=homelab_proxy"
  #     - "traefik.http.routers.overseerr.rule=Host(`overseerr.${TRAEFIK_DOMAIN}`)"
  #     - "traefik.http.routers.overseerr.entrypoints=websecure"
  #     - "traefik.http.routers.overseerr.tls.certresolver=cloudflare"
  #     - "traefik.http.routers.overseerr.middlewares=authentik@docker"
  #     - "traefik.http.services.overseerr.loadbalancer.server.port=5055"

  # Tautulli — Plex monitoring, history & transcode stats.
  # Reaches Plex over the host LAN (Plex runs network_mode: host on :32400).
  # On first run, point it at http://<server-LAN-IP>:32400.
  tautulli:
    logging: *default-logging
    image: lscr.io/linuxserver/tautulli:v2.17.2-ls237
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/tautulli:/config
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.tls.certresolver=cloudflare"
      - "traefik.http.routers.tautulli.middlewares=authentik@docker"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

  # ----------------------------
  # BOOKS / LIBRARY
  # ----------------------------

  calibre-web-automated:
    logging: *default-logging
    image: crocodilestick/calibre-web-automated@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
    container_name: calibre-web-automated
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/calibre-web:/config
      - ${LIBRARY}:/calibre-library
      - ${BOOK_INGEST}:/cwa-book-ingest # ingest dir; files removed after processing
    restart: unless-stopped
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.calibre-web.rule=Host(`calibre-web.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.calibre-web.entrypoints=websecure"
      - "traefik.http.routers.calibre-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.calibre-web.middlewares=authentik@docker"
      - "traefik.http.services.calibre-web.loadbalancer.server.port=8083"

  # ----------------------------
  # SYNC
  # ----------------------------

  syncthing:
    logging: *default-logging
    image: syncthing/syncthing:2.1.2
    container_name: syncthing
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "22000:22000/tcp" # sync
      - "22000:22000/udp"
      - "21027:21027/udp" # discovery
      # GUI (8384) can be proxied on homelab_proxy; publish if you need host access:
      # - "8384:8384"
    volumes:
      - ./config/syncthing:/var/syncthing/config
      - ${SAVES}:/var/syncthing/data
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.syncthing.rule=Host(`syncthing.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.syncthing.entrypoints=websecure"
      - "traefik.http.routers.syncthing.tls.certresolver=cloudflare"
      - "traefik.http.routers.syncthing.middlewares=authentik@docker"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"
  # ----------------------------
  # SIYUAN
  # ----------------------------

  siyuan:
    logging: *default-logging
    image: b3log/siyuan:v3.1.17
    container_name: siyuan
    command:
      - '--workspace=/siyuan/workspace/'
    ports:
      - 10.13.89.90:6806:6806   # LAN/VPN only — API access goes here, not via Traefik
    volumes:
      - ./config/siyuan/workspace:/siyuan/workspace
    restart: unless-stopped
    environment:
      # A list of time zone identifiers can be found at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=${TZ}
      - PUID=${PUID}  # Customize user ID
      - PGID=${PGID}  # Customize group ID
      - SIYUAN_ACCESS_AUTH_CODE_BYPASS=${SIYUAN_ACCESS_AUTH_CODE_BYPASS}
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      # Web UI behind Authentik. /api is NOT exposed publicly anymore — reach the
      # API on the LAN/VPN at http://10.13.89.90:6806 (SiYuan's token auth protects it).
      - "traefik.http.routers.siyuan.rule=Host(`siyuan.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.siyuan.entrypoints=websecure"
      - "traefik.http.routers.siyuan.tls.certresolver=cloudflare"
      - "traefik.http.routers.siyuan.middlewares=authentik@docker"
      - "traefik.http.services.siyuan.loadbalancer.server.port=6806"

  # ----------------------------
  # MINABOT — Minagine auto clock-in/out (see minabot/README.md)
  # ----------------------------

  # Headless Chrome for minabot. restart: "no" is intentional: minabot starts
  # it via the docker socket ~5 min before each clock action and stops it
  # after, so it uses no RAM most of the day. Every `compose up -d` (deploy +
  # weekly update) recreates/starts it; the bot stops it again after its next
  # run. NOTE: weekly-update.sh's `docker system prune -f` deletes stopped
  # containers — that killed the old standalone setup. Here the weekly
  # `up -d` runs before the prune, and minabot can also recreate the
  # container itself from the mounted compose file.
  minabot-selenium:
    logging: *default-logging
    image: selenium/standalone-chrome@sha256:9569014786466376d3e5cf8a7758562368cd9637f783dcd3abdb2eaf3a0d5cd7
    container_name: minabot-selenium
    restart: "no"
    environment:
      - TZ=${TZ}
      # Reduce memory usage
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=300
    shm_size: 512m
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:4444/wd/hub/status" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - homelab

  minabot:
    logging: *default-logging
    build: ./minabot
    container_name: minabot
    restart: unless-stopped
    # Minagine credentials + schedule; untracked, lives only on the server
    # (same convention as the root .env).
    env_file:
      - ./minabot/script/.env
    volumes:
      - ./minabot/script:/script
      - ./data/minabot/logs:/logs
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      # Docker socket: start/stop minabot-selenium on demand
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose file + env so the bot can recreate minabot-selenium if it was
      # removed (e.g. by docker system prune) — see minabot/README.md
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      - ./.env:/compose/.env:ro
    tty: true
    healthcheck:
      # cron is the scheduler; if it dies the bot is dead → autoheal restarts
      test: [ "CMD", "pgrep", "cron" ]
      interval: 1m
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      [
        "sh",
        "-c",
        "(logrotate /etc/logrotate.d/minabot || echo 'logrotate failed (non-fatal)') && service cron start && $$PYTHON_PATH /script/cron.py && tail -f /dev/null"
      ]
    networks:
      - homelab

  # ----------------------------
  # UTILITIES
  # ----------------------------

  postgres:
    logging: *default-logging
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_SUPERUSER=${POSTGRES_SUPERUSER:-postgres}
      - POSTGRES_DB_SUPERUSER=${POSTGRES_DB_SUPERUSER:-postgres}
      - POSTGRES_PASSWORD_SUPERUSER=${POSTGRES_PASSWORD_SUPERUSER:-password}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_SUPERUSER}", "-d", "${POSTGRES_DB_SUPERUSER}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homelab
    labels:
      - "autoheal=true"

  flaresolverr:
    logging: *default-logging
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - homelab
      - homelab_proxy
    # portal to access all other web UI
  homepage:
    logging: *default-logging
    container_name: homepage
    restart: unless-stopped
    image: ghcr.io/gethomepage/homepage:v1.13.2
    volumes:
      - ./config/homepage:/app/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.antoineglacet.com
      # Service-widget API keys/tokens, referenced in services.yaml as
      # {{HOMEPAGE_VAR_*}}. Values live in .env (never committed).
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY}
      - HOMEPAGE_VAR_TAUTULLI_API_KEY=${TAUTULLI_API_KEY}
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_TOKEN}
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls.certresolver=cloudflare"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      
      # auth
      - "traefik.http.routers.homepage.middlewares=authentik@docker"

  # refresh dynamic IP to cloudflare DNS
  ddclient:
    logging: *default-logging
    image: lscr.io/linuxserver/ddclient:v4.0.0-ls228
    container_name: ddclient
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DDCLIENT_CLOUDFLARE_TOKEN=${DDCLIENT_CLOUDFLARE_TOKEN}
    volumes:
      - ./config/ddclient:/config
    restart: unless-stopped
    networks:
      - homelab
  # ----------------------------
  # NETWORK & ADMIN SERVICES
  # ----------------------------

  # SMB file sharing for Windows clients
  samba:
    logging: *default-logging
    container_name: samba
    image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    volumes:
      - ${DATA}:/data
    environment:
      - USERID=${PUID}
      - GROUPID=${PGID}
      - TZ=${TZ}
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"
    command: >
      samba.sh
        -w "WORKGROUP"
        -s "data;/data;yes;no;no;all"
        -u "${SAMBA_USER};${SAMBA_PASSWORD}"
        -p
        -n
    restart: unless-stopped

  # Ad-blocking DNS server
  adguard:
    logging: *default-logging
    container_name: adguard
    image: adguard/adguardhome:v0.107.74
    volumes:
      - ./config/adguard/work:/opt/adguardhome/work
      - ./config/adguard/conf:/opt/adguardhome/conf
      - ${CERT}:/cert
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
      - 853:853/tcp
    depends_on:
      - traefik
      - traefik-certs-dumper
    restart: unless-stopped
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls.certresolver=cloudflare"
      - "traefik.http.routers.adguard.middlewares=authentik@docker"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"

  # ----------------------------
  # REMOTE ACCESS VPN
  # ----------------------------

  # WireGuard VPN + web UI for secure LAN/service access from anywhere.
  # Admin UI is LAN/VPN-only (not behind Traefik); only the UDP data plane
  # (51820) is meant to be forwarded on the router. VPN clients use AdGuard
  # for DNS and can reach the whole LAN via the host (ip_forward + masquerade).
  wg-easy:
    logging: *default-logging
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    environment:
      - TZ=${TZ}
      - WG_HOST=${WG_HOST}                  # public endpoint, kept current by ddclient
      - PASSWORD_HASH=${WG_PASSWORD_HASH}   # bcrypt hash of admin UI password (in .env)
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS}    # AdGuard on the host (10.13.89.90)
      - WG_DEFAULT_ADDRESS=10.8.0.x         # VPN client subnet, distinct from LAN 10.13/16
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0      # full tunnel (per-client adjustable in UI)
      - WG_PORT=51820                       # advertised WireGuard port in client configs
      - WG_PERSISTENT_KEEPALIVE=25          # keep NAT mappings alive
      - WG_MTU=1280                         # avoids fragmentation over cellular/CGNAT (fixes Moonlight stream)
      - UI_TRAFFIC_STATS=true
    volumes:
      - ./config/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"                   # WireGuard data plane (forward this on the router)
      - "10.13.89.90:51821:51821/tcp"       # admin UI — bound to LAN IP only (also reachable over VPN), NOT via Traefik
    cap_add:
      - NET_ADMIN                           # SYS_MODULE not needed: host has wireguard module loaded + kernel autoload
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - homelab

  # Wake-on-LAN helper: keeps a permanent static ARP entry for the gaming PC on the
  # host LAN interface, so Moonlight's magic packet (arriving over WireGuard) is
  # forwarded to the PC's NIC even while it's powered off. Runs in the host net
  # namespace; no Traefik, no published ports.
  wol-arp:
    logging: *default-logging
    image: alpine:3.20
    container_name: wol-arp
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        apk add --no-cache iproute2 >/dev/null 2>&1
        while true; do
          ip neigh replace 10.13.89.126 lladdr 6c:02:e0:40:24:51 nud permanent dev enp1s0
          sleep 600
        done

  # ----------------------------
  # BACKUP & RECOVERY
  # ----------------------------
  duplicati:
    logging: *default-logging
    image: lscr.io/linuxserver/duplicati:v2.3.0.4_stable_2026-07-09-ls301
    container_name: duplicati
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/duplicati:/config
      - ${BACKUP}:/backups
      - ${HOMESERVER}:/source
    restart: unless-stopped
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.duplicati.rule=Host(`duplicati.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.duplicati.entrypoints=websecure"
      - "traefik.http.routers.duplicati.tls.certresolver=cloudflare"
      - "traefik.http.routers.duplicati.middlewares=authentik@docker"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"

  # ----------------------------
  # INGRESS & SECURITY
  # ----------------------------

  authentik-redis:
    logging: *default-logging
    image: redis:7.4.9-alpine
    container_name: authentik-redis
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${AUTHENTIK_REDIS__PASSWORD}" ]
    restart: unless-stopped
    volumes:
      - authentik_redis_data:/data
    networks:
      - homelab

  authentik-server:
    logging: *default-logging
    image: ghcr.io/goauthentik/server:2025.8.3
    container_name: authentik-server
    command: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=${AUTHENTIK_REDIS__HOST}
      - AUTHENTIK_REDIS__PORT=${AUTHENTIK_REDIS__PORT}
      - AUTHENTIK_REDIS__PASSWORD=${AUTHENTIK_REDIS__PASSWORD}
      - AUTHENTIK_POSTGRESQL__HOST=${AUTHENTIK_POSTGRESQL__HOST}
      - AUTHENTIK_POSTGRESQL__PORT=${AUTHENTIK_POSTGRESQL__PORT}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_POSTGRESQL__USER}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_POSTGRESQL__NAME}
      - AUTHENTIK_LOG_LEVEL=info
    volumes:
      - ./config/authentik/media:/media
      - ./config/authentik:/config
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"

      # Authentik router itself
      - "traefik.http.routers.authentik.rule=Host(`authentik.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=cloudflare"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      
      # ForwardAuth middleware
      - "traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=authorization,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"

  authentik-worker:
    logging: *default-logging
    image: ghcr.io/goauthentik/server:2025.8.3
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=${AUTHENTIK_REDIS__HOST}
      - AUTHENTIK_REDIS__PORT=${AUTHENTIK_REDIS__PORT}
      - AUTHENTIK_REDIS__PASSWORD=${AUTHENTIK_REDIS__PASSWORD}
      - AUTHENTIK_POSTGRESQL__HOST=${AUTHENTIK_POSTGRESQL__HOST}
      - AUTHENTIK_POSTGRESQL__PORT=${AUTHENTIK_POSTGRESQL__PORT}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_POSTGRESQL__USER}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_POSTGRESQL__NAME}
      - AUTHENTIK_LOG_LEVEL=info
    volumes:
      - ./config/authentik/media:/media
      - ./config/authentik:/config
    networks:
      - homelab

  # Reverse proxy, dashboard & certificates
  traefik:
    logging: *default-logging
    image: traefik:v3.7.0
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443

      # 👇 Tell Traefik to request one cert for root + wildcard on websecure
      - --entrypoints.websecure.http.tls.domains[0].main=antoineglacet.com
      - --entrypoints.websecure.http.tls.domains[0].sans=*.antoineglacet.com

      # ACME (DNS-01 via Cloudflare)
      - --certificatesresolvers.cloudflare.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --log.level=INFO
      
      # Metrics endpoint for Prometheus
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --entryPoints.metrics.address=:8082
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${TRAEFIK_CLOUDFLARE_TOKEN}
      - TRAEFIK_DOMAIN=${TRAEFIK_DOMAIN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/letsencrypt:/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway" # this is for containers running in network_mode: host
    networks:
      - homelab
      - homelab_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_proxy"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik.middlewares=authentik@docker"
      - "traefik.http.routers.traefik.service=api@internal"
      
      # Security headers middleware
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Robots-Tag=none"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      
      # Rate limiting middleware
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1s"

  traefik-certs-dumper:
    logging: *default-logging
    image: ldez/traefik-certs-dumper:v2.9.1
    container_name: traefik-certs-dumper
    command:
      - file
      - --source
      - /letsencrypt/acme.json
      - --dest
      - /output
      - --domain-subdir=true
      - --watch
    restart: unless-stopped
    depends_on:
      - traefik
    volumes:
      - ./config/traefik/letsencrypt:/letsencrypt
      - ./config/traefik/certs:/output

  # Restart containers based on health
  autoheal:
    logging: *default-logging
    image: willfarrell/autoheal@sha256:234413eaa9a585978f6cb2d35f0dcdeb70fc4dadbaa3d7230197dd17e97125fb
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      # docker socket, be careful with this
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ----------------------------
  # ALERTING - Handled by Grafana
  # ----------------------------
  # Alertmanager and alertmanager-discord removed - using Grafana Alerting instead
  # All alerts are now configured in config/grafana/provisioning/alerting/
  # Contact points, policies, and rules are all managed through Grafana

# not sure why we only use this for appflowy stuff  
volumes:
  postgres_data:
  authentik_redis_data:
