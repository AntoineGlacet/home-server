/logs/*.log {
    # /logs is a bind mount owned by the host user, not root — without su,
    # logrotate refuses the "insecure" parent dir and exits non-zero
    su root root
    size 50M
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0644 root root
}
