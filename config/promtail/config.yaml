server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_container_label_traefik_http_routers']
        target_label: traefik_router
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: log_stream
      - source_labels: ['__meta_docker_container_label_org_label_schema_group']
        target_label: stack
    pipeline_stages:
      - docker: {}
      # Do not ingest the logging stack's own output. Shipping loki's stdout
      # into loki is a feedback loop: loki logs about the push, promtail ships
      # that too. Dropping here rather than in relabel_configs keeps the target
      # discovered and labelled, which avoids promtail flushing a label-less
      # stream on every discovery refresh.
      - match:
          selector: '{container=~"loki|promtail"}'
          action: drop
      # nordlynx pretty-prints the entire NordVPN server catalogue as JSON on
      # every (re)connect -- thousands of lines in one burst. Promtail fell
      # more than an hour behind draining that stream, which put the entries
      # outside Loki's out-of-order window (max_chunk_age/2, 1h by default), so
      # Loki 400'd every retry and the batch was discarded: ~525 "final error
      # sending batch" per day, and real VPN log lines lost with it. Drop the
      # JSON body only -- the "[#] ip link ...", "[<ts>] Connected!" and
      # s6/Error lines that actually say what the tunnel did are kept.
      - match:
          selector: '{container="nordlynx"}'
          stages:
            - drop:
                expression: '^\s*(?:[{}\[\],]+|"[^"]+"\s*:.*)\s*$'
                drop_counter_reason: nordlynx_server_catalogue
